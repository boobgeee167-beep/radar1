<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>غرفة عمليات الكريبتو</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="p-3 max-w-md mx-auto pb-12">

  <!-- الرأس -->
  <header class="flex justify-between items-center mb-3 pb-2 border-b border-slate-700">
    <div>
      <h1 class="text-base font-bold text-cyan-400">غرفة عمليات الساعي</h1>
      <p class="text-[11px] text-slate-400">التحليلات والرسوم المباشرة</p>
    </div>
    <div class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
      متصل
    </div>
  </header>

  <!-- أزرار التنقل بين الواجهات -->
  <nav class="grid grid-cols-2 gap-2 mb-4 bg-slate-900/80 p-1.5 rounded-xl border border-slate-700/60">
    <a href="radar.html" class="py-2 text-xs font-bold rounded-lg bg-cyan-600 text-white text-center transition shadow">
      📡 رادار السوق
    </a>
    <a href="chart.html" class="py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 hover:text-white text-center transition">
      📊 شارت TradingView
    </a>
  </nav>

  <!-- شاشة ترحيبية سريعة -->
  <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 text-center space-y-3">
    <div class="text-3xl">🚀</div>
    <h2 class="text-sm font-bold text-slate-200">مرحباً بك في غرفة عملياتك الخاصة</h2>
    <p class="text-xs text-slate-400 leading-relaxed">
      تم فصل الواجهات لسهولة التطوير والصيانة. اختر الواجهة التي تريد الانتقال إليها من الأعلى، أو اضغط على الأزرار للانتقال الفوري.
    </p>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
